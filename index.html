<title>Encuesta de satisfacción de la clase de Inglés, 2026</title>
<style>
:root{--bg:#f2f5f4;--paper:#fff;--ink:#1a2623;--mute:#52625d;--line:#d3ddd9;--board:#1e3b35;--chalk:#f3f6f2;--hi:#f2cf4f;--hiT:#1b2a26;--mark:#f7df7e;--soft:#fdf5cf;--sel:#1e3b35;--btn:#1e3b35;--btnT:#fff;--wood:#8a6a43;--warn:#b3261e;--warnbg:#fdecea;--ok:#1f7a4d;--grid:rgba(30,59,53,.06);--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;--shadow:0 1px 2px rgba(20,40,35,.08),0 6px 18px -8px rgba(20,40,35,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111917;--paper:#18231f;--ink:#e9f0ed;--mute:#9db1aa;--line:#2d3c38;--board:#0d1916;--mark:rgba(242,207,79,.32);--soft:#2b3320;--sel:#f2cf4f;--btn:#f2cf4f;--btnT:#1b2a26;--wood:#5c4529;--warn:#ff8a80;--warnbg:#3a1d1b;--ok:#6fd49f;--grid:rgba(255,255,255,.035);--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
main{max-width:680px;margin:0 auto;padding:0 16px 24px}
.wrap{max-width:680px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;box-shadow:0 2px 10px rgba(0,0,0,.22);background:var(--board);color:var(--chalk)}
.steps{display:flex;gap:4px}
.seg{flex:1;height:8px;transition:background .25s;padding:0;margin:0;border:0;border-radius:4px;background:rgba(243,246,242,.25);cursor:pointer}
.seg.done{background:rgba(242,207,79,.65)}
.seg.cur{background:var(--hi);box-shadow:0 0 0 2px var(--board),0 0 0 4px var(--hi)}
.seg:disabled{cursor:default}
#pt{display:block;margin-top:9px;font-size:13px;color:rgba(243,246,242,.85)}
.head{display:flex;align-items:center;gap:14px;margin:18px 2px 14px}
.crest{flex:none;width:72px;height:auto;display:block}
.head b{display:block;font-family:var(--serif);font-size:1.12rem;line-height:1.2;letter-spacing:.005em}
.head span{display:block;margin-top:2px;font-size:13px;color:var(--mute);line-height:1.35}
.intro{position:relative;background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.07),transparent 60%),var(--board);color:var(--chalk);border:7px solid var(--wood);border-image:linear-gradient(135deg,#b08d5e,#7a5b36 45%,#9c7a4c) 1;border-radius:0;padding:8px 22px 18px;margin:0 0 4px;box-shadow:inset 0 0 44px rgba(0,0,0,.28),var(--shadow)}
.intro::after{content:"";position:absolute;right:16px;bottom:-1px;width:64px;height:7px;border-radius:7px 7px 0 0;background:var(--hi);opacity:.9}
.intro .eta{display:inline-flex;align-items:center;gap:8px;margin:2px 0 10px;padding:7px 14px;border:1.5px solid var(--hi);border-radius:999px;background:rgba(242,207,79,.14);color:var(--chalk);font-weight:650;font-size:.95rem;line-height:1.3}
.eta svg{flex:none;width:18px;height:18px;stroke:var(--hi)}
.sign{font-family:var(--serif);font-style:italic;color:var(--chalk)}
h1{font-family:var(--serif);font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.15;margin:14px 0 14px;padding-bottom:12px;letter-spacing:-.005em;font-weight:700;border-bottom:2px dashed rgba(243,246,242,.35)}
.intro p{margin:8px 0;max-width:62ch;color:rgba(243,246,242,.9)}
.intro .link{color:var(--hi)}
h2:focus{outline:none}
h2{display:inline-block;font-family:var(--serif);font-size:1.4rem;line-height:1.3;margin:26px 0 14px;padding:0 4px;background:linear-gradient(transparent 58%,var(--mark) 58%)}
.link{background:none;border:0;color:var(--sel);text-decoration:underline;cursor:pointer;padding:0;font:inherit;text-align:left}
fieldset.q{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px 14px 14px 6px;background:var(--paper);box-shadow:var(--shadow);margin:0 0 18px;padding:14px 14px 8px 14px;min-width:0;transition:border-color .2s}
fieldset.q.ok{border-left-color:var(--hi)}
fieldset.q[hidden]{display:none}
fieldset.q.err{border-color:var(--warn);background:var(--warnbg)}
legend{float:left;width:100%;padding:0;margin:0 0 12px;font-weight:650;font-size:1.04rem;line-height:1.4}
legend+*{clear:both}
legend b{display:inline-block;min-width:1.9em;margin-right:6px;padding:1px 7px;border-radius:999px;background:var(--board);color:var(--chalk);font-size:.82rem;text-align:center;vertical-align:1px}
.note{color:var(--mute);font-size:14px;margin:0 0 8px}
.opt{display:flex;gap:10px;align-items:center;padding:11px 12px;margin:6px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--mute)}
.opt:has(input:checked){background:var(--soft);border-color:var(--sel)}
.opt>input:not(.otro){accent-color:var(--sel);width:18px;height:18px;flex:none}
.otro{flex:1;min-width:0;font:inherit;padding:4px 6px;border:0;border-bottom:1.5px solid var(--mute);background:transparent;color:var(--ink)}
select,textarea{width:100%;font:inherit;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
textarea{min-height:150px;resize:vertical}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-bottom:2px;position:sticky;top:var(--topH,64px);z-index:3;background:var(--paper);padding:7px 0;border-bottom:1px solid var(--line)}
.row{padding:12px 0 8px;border-top:1px dashed var(--line)}
.ends+.row,.note+.row{border-top:0}
.row p{margin:0 0 8px}
.row .num{color:var(--mute);margin-right:2px}
.row.miss .num{color:inherit}
.row.miss p{color:var(--warn);font-weight:650}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.scale label,.na{position:relative}
.scale input,.na input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.scale span{display:block;text-align:center;padding:12px 0;border:1.5px solid var(--line);border-radius:10px;font-weight:700;background:var(--paper);transition:transform .1s,border-color .15s}
.scale label:hover span{border-color:var(--mute)}
.scale label:active span{transform:scale(.96)}
.meta{display:flex;align-items:center;gap:10px;margin-top:6px;min-height:28px}
.na{display:inline-block}
.na span{display:flex;align-items:center;min-height:44px;padding:0 18px;border:1px dashed var(--mute);border-radius:999px;font-size:14px;color:var(--mute)}
.lab{margin-left:auto;font-size:13px;color:var(--mute)}
input:checked+span{background:var(--hi);color:var(--hiT);border-color:var(--hi);border-style:solid}
.scale input:checked+span{font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.25)}
input:focus-visible+span,.opt:has(input:focus-visible),select:focus-visible,textarea:focus-visible,.link:focus-visible,.btn:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.seg:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.dock{position:sticky;bottom:0;margin:8px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 16px -10px rgba(0,0,0,.35)}
#msg{color:var(--warn);font-weight:650;font-size:14px;margin:0 0 6px}
#msg.info{color:var(--ok)}
#msg:empty{display:none}
.nav{display:flex;gap:10px}
.btn{font:inherit;font-weight:700;background:var(--btn);color:var(--btnT);border:2px solid var(--btn);border-radius:10px;padding:13px 18px;flex:1;cursor:pointer;transition:filter .15s,transform .1s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--btn);flex:0 0 36%}
.btn[hidden]{display:none}
.btn:disabled{opacity:.6;cursor:wait}
.fin{text-align:center;padding:48px 10px}
.fin .link{text-align:center}
.fin .otra{margin:30px auto 0;max-width:380px;padding:16px;border:1.5px dashed var(--mute);border-radius:12px;text-align:center}
.fin .otra p{margin:0 0 12px;font-size:14px;color:var(--mute)}
.fin .otra .btn{flex:none;width:100%}
.fin .tick{width:72px;height:72px;border-radius:50%;background:var(--hi);color:var(--hiT);font-size:40px;font-weight:800;line-height:72px;margin:0 auto 16px}
.crest{filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
@media (prefers-color-scheme:dark){.crest{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px rgba(255,255,255,.7))}}
@media (max-width:380px){.crest{width:58px}.head{gap:10px}.intro .eta{font-size:.84rem;padding:6px 11px;gap:6px}.eta svg{width:16px;height:16px}}
.send{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,20,17,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.send[hidden]{display:none}
.send .card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px 20px 22px;text-align:center;box-shadow:var(--shadow);outline:0}
.send .em{font-size:54px;line-height:1;margin-bottom:8px}
.send h2{display:block;margin:0 0 8px;padding:0;background:none;font-size:1.35rem}
.send p{margin:0 0 12px}
.send .aviso{background:var(--soft);border:1.5px solid var(--hi);border-radius:10px;padding:10px 12px;font-weight:650}
.send #sinfo{min-height:1.4em;margin:0;font-size:14px;color:var(--mute)}
.send .nav{flex-direction:column;margin-top:14px}
.send .btn.ghost{flex:none}
.send .btn[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.send .em.gira{animation:gira 1.6s ease-in-out infinite}@keyframes gira{50%{transform:rotate(180deg) scale(1.08)}to{transform:rotate(360deg)}}}
@media (prefers-reduced-motion:no-preference){.step{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}

/* ---------- Lectura de respuestas ---------- */
function collect(mark) {
  const a = { T_seg: Math.round((Date.now() - t0) / 1000) }, miss = [], det = {};
  Q.forEach((q, i) => {
    const n = i + 1, fs = $("#q" + n), hid = fs.hidden;
    let ok = true;
    if (q.t === "grid") {
      q.r.forEach((r, j) => {
        const c = hid ? null : f.querySelector(`input[name="q${n}_${j}"]:checked`);
        a[`P${n}_${q.ids ? q.ids[j] : j + 1}`] = c && c.value !== "NA" ? +c.value : "";
        if (!hid && !c) { ok = false; (det[n] = det[n] || []).push(j + 1); }
        if (mark && mark.has(n)) fs.querySelector(`.row[data-r="${j}"]`).classList.toggle("miss", !hid && !c);
      });
    } else if (q.t === "select") {
      a["P" + n] = f.querySelector(`[name="q${n}"]`).value; ok = !!a["P" + n];
    } else if (q.t === "text") {
      a["P" + n] = f.querySelector(`[name="q${n}"]`).value.trim();
    } else {
      const cs = hid ? [] : [...f.querySelectorAll(`input[name="q${n}"]:checked`)];
      const det = c => c.parentElement.querySelector(".otro").value.trim();
      if (q.t === "radio") {
        const c = cs[0];
        a["P" + n] = !c ? "" : q.ord ? (q.ord === "asc" ? +c.dataset.i + 1 : q.o.length - c.dataset.i) : (c.value === "__otro" ? "Otro: " + (det(c) || "(sin detalle)") : c.value);
      } else {
        q.o.forEach((o, j) => { a[`P${n}_${j + 1}`] = cs.some(c => +c.dataset.i === j) ? 1 : 0; });
        if (q.o.some(o => o.endsWith(":"))) { const oc = cs.find(c => c.value === "__otro"); a[`P${n}_otro`] = oc ? det(oc) : ""; }
      }
      ok = cs.length > 0;
    }
    if (q.t !== "text" && !hid && !ok) miss.push(n);
    if (mark && mark.has(n)) fs.classList.toggle("err", !hid && !ok);
  });
  return { a, miss, det };
}

/* Describe cada columna de la hoja: Code.gs la usa para armar encabezados, diccionario y resúmenes. */
function cols() {
  const c = [{ c: "T_seg", t: "Metadatos", l: "Segundos que tardó en responder", k: "num" }];
  Q.forEach((q, i) => {
    const n = i + 1, P = "P" + n;
    if (q.t === "grid") q.r.forEach((r, j) => c.push({ c: `${P}_${q.ids ? q.ids[j] : j + 1}`, t: q.q, l: r + ((q.freq || []).includes(j) ? " [frecuencia: 1 = Nunca … 5 = Siempre]" : ""), k: "likert", rev: (q.rev || []).includes(j) ? 1 : 0, info: (q.info || []).includes(j) ? 1 : 0 }));
    else if (q.t === "check") {
      q.o.forEach((o, j) => c.push({ c: `${P}_${j + 1}`, t: q.q, l: o.replace(/:$/, ""), k: "bin" }));
      if (q.o.some(o => o.endsWith(":"))) c.push({ c: P + "_otro", t: q.q, l: "Otro (texto escrito)", k: "text" });
    } else if (q.ord) c.push({ c: P, t: q.q, l: q.o.map((o, j) => (q.ord === "asc" ? j + 1 : q.o.length - j) + " = " + o).join("; "), k: "ord", info: q.info ? 1 : 0 });
    else c.push({ c: P, t: q.q, l: q.t === "text" ? "Respuesta libre" : "Opción elegida", k: "text", ops: q.t === "text" ? [] : q.o.map(o => o.replace(/:$/, "")) });
  });
  return c;
}

/* ---------- Estado, avance y borrador ---------- */
function caption(row) {
  const c = row.querySelector("input:checked");
  const L = row.hasAttribute("data-f") ? SCF : SC;
  row.querySelector(".lab").textContent = c ? (c.value === "NA" ? "No aplica" : L[+c.value - 1]) : "";
}
/* El avance se guarda a la vez en tres lugares del navegador (si uno falla, quedan los otros). */
const store = {
  get() {
    for (const w of ["localStorage", "sessionStorage"]) { try { const v = window[w].getItem(KEY); if (v) return v; } catch (e) {} }
    if (String(window.name).startsWith(KEY + ":")) return window.name.slice(KEY.length + 1);
    return null;
  },
  set(v) {
    for (const w of ["localStorage", "sessionStorage"]) { try { window[w].setItem(KEY, v); } catch (e) {} }
    try { window.name = KEY + ":" + v; } catch (e) {}
  },
  del() {
    for (const w of ["localStorage", "sessionStorage"]) { try { window[w].removeItem(KEY); } catch (e) {} }
    try { if (String(window.name).startsWith(KEY + ":")) window.name = ""; } catch (e) {}
  }
};
let enviado = false, enviando = false;   /* evita envíos dobles y que un borrador reviva después de enviar */
/* Marca "ya envió": se guarda en localStorage y en una cookie (si uno falla, queda el otro). No se borra al recargar. */
const MARCA = "enviado-2026";
function leerMarca() {
  try { const v = localStorage.getItem(MARCA); if (v) return v; } catch (e) {}
  try { const m = document.cookie.match(new RegExp("(?:^|; )" + MARCA + "=([^;]*)")); if (m) return decodeURIComponent(m[1]); } catch (e) {}
  return null;
}
function marcarEnviado() {
  const v = String(Date.now());
  try { localStorage.setItem(MARCA, v); } catch (e) {}
  try { document.cookie = MARCA + "=" + v + "; max-age=31536000; path=/; SameSite=Lax"; } catch (e) {}
}
function borrarMarca() {
  try { localStorage.removeItem(MARCA); } catch (e) {}
  try { document.cookie = MARCA + "=; max-age=0; path=/; SameSite=Lax"; } catch (e) {}
  try { store.del(); } catch (e) {}
}
function otraPersona() { borrarMarca(); location.reload(); }
const BLOQUE_OTRA = '<div class="otra"><p>¿Eres otra persona que usa este mismo dispositivo (un familiar, un compañero o una compañera)? Cada persona responde una sola vez.</p><button type="button" class="btn ghost" id="otra" onclick="otraPersona()">Soy otra persona: responder mi encuesta</button></div>';
function mostrarYaEnvio(v) {

  const t = document.querySelector(".top"); if (t) t.remove();
  $("#app").innerHTML = `<div class="fin"><div class="tick">✓</div><h2>Ya enviaste tus respuestas</h2><p>Ya enviaste tus respuestas desde este dispositivo${cuando}. No necesitas responder otra vez. ¡Gracias!</p>${BLOQUE_OTRA}</div>`;
}
function save() {
  if (enviado) return;
  try {
    const o = { id, ts: Date.now(), s: Math.round((Date.now() - t0) / 1000), cur, maxV, k: [...f.querySelectorAll("input:checked")].map(x => x.dataset.k), t: {} };
    f.querySelectorAll(".otro,textarea,select").forEach(x => { if (x.value) o.t[x.dataset.k || x.name] = x.value; });
    store.set(JSON.stringify(o));
  } catch (e) {}
}
function restore() {
  try {
    const o = JSON.parse(store.get() || "null");
    if (!o) return false;
    if (!o.ts || Date.now() - o.ts > VIDA) { store.del(); return false; }   // borrador viejo o sin fecha: se descarta
    id = o.id || id; maxV = o.maxV || 0;
    t0 = Date.now() - (o.s || 0) * 1000;     // el tiempo de respuesta sigue contando si retoma un borrador
    (o.k || []).forEach(k => { const x = f.querySelector(`[data-k="${k}"]`); if (x) x.checked = true; });
    Object.keys(o.t || {}).forEach(k => { const x = f.querySelector(`.otro[data-k="${k}"]`) || f.querySelector(`[name="${k}"]`); if (x) x.value = o.t[k]; });
    cur = Math.min(o.cur || 0, steps.length - 1);
    return o.k.length > 0 || Object.keys(o.t).length > 0;
  } catch (e) { return false; }
}
function toggles() {
  Q.forEach((q, i) => {
    if (!q.hideIf) return;
    const c = f.querySelector(`input[name="q${q.hideIf.n}"]:checked`);
    $("#q" + (i + 1)).hidden = !!c && c.value === q.hideIf.v;
  });
}
function progress() {
  const { miss } = collect();
  const dada = (q, i) => {
    const fs = $("#q" + (i + 1));
    if (fs.hidden) return false;
    return q.t === "text" ? !!f.querySelector(`[name="q${i + 1}"]`).value.trim() : !miss.includes(i + 1);
  };
  let hechas = 0;
  Q.forEach((q, i) => { const ok = dada(q, i); if (ok || $("#q" + (i + 1)).hidden) hechas++; $("#q" + (i + 1)).classList.toggle("ok", ok); });
  $("#pt").textContent = `Sección ${cur + 1} de ${steps.length} · ${hechas} de ${Q.length} preguntas respondidas`;
  document.querySelectorAll(".seg").forEach((b, i) => {
    b.classList.toggle("cur", i === cur);
    b.classList.toggle("done", i <= maxV && i !== cur && !steps[i].qs.some(x => miss.includes(x + 1)));
    b.disabled = i > maxV;

}
const unir = v => v.length < 2 ? v.join("") : v.slice(0, -1).join(", ") + " y " + v[v.length - 1];

const faltan = (ns, det) => ns.map(n => { const d = det[n]; return !d ? String(n) : d.length > 6 ? `${n} (${d.length} frases sin marcar)` : `${n} (${d.length === 1 ? "frase" : "frases"} ${unir(d.map(x => n + "." + x))})`; }).join(", ");
const msg = (t, info) => { const m = $("#msg"); m.textContent = t; m.classList.toggle("info", !!info); };

  const row = t.closest(".row"); if (row) caption(row);
  if (t.type === "checkbox" && t.checked) f.querySelectorAll(`input[name="${t.name}"]`).forEach(x => { if (x !== t && (t.dataset.x || x.dataset.x)) x.checked = false; });
  fs.classList.remove("err"); fs.querySelectorAll(".miss").forEach(r => r.classList.remove("miss"));
  toggles(); progress(); save();
});
f.addEventListener("input", e => {
  if (e.target.classList.contains("otro")) {
    const c = e.target.closest("label").querySelector("input:not(.otro)");
    if (!c.checked) { c.checked = true; c.dispatchEvent(new Event("change", { bubbles: true })); return; }
  }
  save();
});
document.querySelectorAll(".seg").forEach((b, i) => b.addEventListener("click", () => { if (i <= maxV) go(i, true); }));
$("#prev").addEventListener("click", () => go(cur - 1, true));
$("#reset").addEventListener("click", () => { store.del(); location.reload(); });

$("#next").addEventListener("click", async () => {
  const mark = new Set(steps[cur].qs.map(x => x + 1));
  const { miss, det } = collect(mark), mine = miss.filter(n => mark.has(n));
  if (mine.length) {
    msg(`Falta responder ${mine.length === 1 ? "la pregunta" : "las preguntas"} ${faltan(mine, det)}.`);
    const fs1 = $("#q" + mine[0]);
    (fs1.querySelector(".row.miss") || fs1).scrollIntoView({ behavior: smooth, block: "center" });
    return;
  }
  if (cur < steps.length - 1) return go(cur + 1, true);
  if (miss.length) {
    const si = steps.findIndex(st => st.qs.some(x => miss.includes(x + 1)));
    go(si);
    collect(new Set(steps[si].qs.map(x => x + 1)));          // marca en rojo lo que falta en esa sección
    msg(`Antes de enviar, falta responder: ${faltan(miss, det)}.`);
    const fm = document.querySelector(".step:not([hidden]) .row.miss, .step:not([hidden]) fieldset.err");
    if (fm) fm.scrollIntoView({ behavior: smooth, block: "center" });
    return;
  }
  await send();
});

/* ---------- Envío ---------- */
const hash = t => { let a = 0xdeadbeef, b = 0x41c6ce57; for (let i = 0; i < t.length; i++) { const c = t.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); } a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909); b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909); return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36); };
const pausa = ms => new Promise(r => setTimeout(r, ms));
const guard = e => { e.preventDefault(); e.returnValue = ""; };
let tibio = false;
/* Despierta el script de Google antes de enviar: así el envío no espera el arranque en frío. */
function calentar() {
  if (tibio) return;
  tibio = true;
  try { fetch(SCRIPT_URL, { mode: "no-cors", cache: "no-store" }).catch(() => {}); } catch (e) {}
}

function panel(t) {
  const P = {
    envio: ["⏳", "Enviando tus respuestas…", "Un momento: estamos guardando lo que contestaste.", true],
    error: ["⚠️", "No se pudo enviar", "No pasa nada: tus respuestas siguen guardadas en este dispositivo. Revisa tu conexión y vuelve a intentarlo.", false]
  }[t];
  $("#semo").textContent = P[0]; $("#semo").classList.toggle("gira", t === "envio");
  $("#stit").textContent = P[1]; $("#stxt").textContent = P[2];
  $("#saviso").hidden = !P[3]; $("#sinfo").textContent = "";
  $("#sretry").hidden = $("#sback").hidden = t === "envio";
  $("#send").hidden = false; document.body.style.overflow = "hidden";
  ["main", ".top"].forEach(q => { const n = document.querySelector(q); if (n) n.inert = true; });
  ($("#sretry").hidden ? $("#send .card") : $("#sretry")).focus();
}
function cerrarPanel() {
  $("#send").hidden = true; document.body.style.overflow = "";
  ["main", ".top"].forEach(q => { const n = document.querySelector(q); if (n) n.inert = false; });
}

async function post(conCols) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  try {
    const body = { id, sig: "v1-" + hash(JSON.stringify(cols())), answers: collect().a };
    if (conCols) body.cols = cols();
    const r = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(body), signal: ctl.signal });
    return await r.json();
  } finally { clearTimeout(to); }
}
/* Manda solo las respuestas; la lista de columnas va únicamente si el script la pide (o si es una versión anterior). */
async function intentar() {
  let j = await post(false);
  if (!j || !j.ok) j = await post(true);
  if (!j || !j.ok) throw new Error((j && j.error) || "Error");
}
async function enviarConAvisos() {
  panel("envio");
  const t = Date.now(); let nota = "";
  const tick = setInterval(() => {
    const s = Math.round((Date.now() - t) / 1000);
    $("#sinfo").textContent = nota || (s >= 8 ? `Está tardando más de lo normal, seguramente por la señal. Sigue en esta página. (${s} s)` : "");
  }, 1000);
  addEventListener("beforeunload", guard);
  try {
    for (let n = 1; n <= 3; n++) {
      try { await intentar(); return true; }
      catch (e) { if (n === 3) throw e; nota = `Reintentando… (intento ${n + 1} de 3)`; $("#sinfo").textContent = nota; await pausa(1500 * n); }
    }
  } catch (e) { panel("error"); return false; }
  finally { clearInterval(tick); removeEventListener("beforeunload", guard); }
}

async function send() {
  if (enviando || enviado) return;
  enviando = true;
  const b = $("#next"); b.disabled = true; msg("");
  const ok = await enviarConAvisos();
  enviando = false;
  b.disabled = false;
  if (!ok) { b.textContent = "Reintentar envío"; return; }
  enviado = true;                       // desde aquí save() ya no escribe nada
  marcarEnviado();                     // recuerda en este dispositivo que ya respondió
  cerrarPanel(); store.del();
  document.querySelector(".top").remove();
  $("#app").innerHTML = `<div class="fin"><div class="tick">✓</div><h2>¡Gracias por responder!</h2><p>Gracias por tomarte el tiempo de contestar con sinceridad. Tu opinión me ayuda a mejorar la clase de Inglés y a preparar mejor lo que viene.</p><p class="sign" style="color:var(--mute)">James Montoya, profesor de Inglés<br>Institución Educativa Juan XXIII</p><p>Tus respuestas fueron enviadas. Ya puedes cerrar esta página.</p>${BLOQUE_OTRA}</div>`;
  window.scrollTo({ top: 0 });
}
$("#sretry").addEventListener("click", send);
$("#sback").addEventListener("click", () => { cerrarPanel(); $("#next").focus(); });

/* ---------- Inicio ---------- */
function medirTop() { const t = $(".top"); document.documentElement.style.setProperty("--topH", (t ? t.offsetHeight : 0) + "px"); }
medirTop(); addEventListener("resize", medirTop); addEventListener("load", medirTop);
const yaEnvio = leerMarca();
if (yaEnvio) { mostrarYaEnvio(yaEnvio); } else {
const retomado = restore();
if (retomado) $("#resumed").hidden = false;
document.querySelectorAll(".row").forEach(caption);
toggles(); go(cur);
if (retomado && cur > 0) msg(`Recuperamos tu avance: sigues en la sección ${cur + 1} de ${steps.length}.`, true);
addEventListener("pagehide", save);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });
}
</script>
